# Helfer, die die Automationen brauchen. In configuration.yaml einbinden, zum Beispiel:
#   input_number: !include_dir_merge_named ...   oder die Bloecke direkt dort eintragen.
# Alternativ in der Oberflaeche unter Einstellungen -> Geraete & Dienste -> Helfer anlegen.

input_number:
  noah_letzter_sollwert:
    name: NOAH letzter Sollwert
    min: 0
    max: 800
    step: 1
    unit_of_measurement: W
    mode: box

input_boolean:
  noah_diff_warnung:
    name: NOAH SoC-Differenz-Warnung aktiv
    icon: mdi:battery-alert

# Erwartet wird ausserdem ein Sensor sensor.hausverbrauch (aktuelle Leistung des Haushalts in W).
# Woher er kommt, ist egal: Smart-Meter-Lesekopf, Summe von Messsteckdosen, Template-Sensor.
# Beispiel fuer einen Template-Sensor aus Netzbezug und NOAH-Ausgang:
#
# template:
#   - sensor:
#       - name: Hausverbrauch
#         unique_id: hausverbrauch
#         unit_of_measurement: W
#         device_class: power
#         state_class: measurement
#         state: >
#           {{ (states('sensor.stromzaehler_leistung') | float(0)
#               + states('sensor.noah_2000_output_power') | float(0)) | round(0) }}
